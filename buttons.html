<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Практична №4 - Приклади кнопок</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Bootstrap 5 Практична</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Картки</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="buttons.html">Приклади кнопок</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="alerts.html">Приклади Alert</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-4">

        <div class="alert alert-info alert-dismissible fade show" role="alert">
            Сторінка «Приклади кнопок» успішно завантажена!
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Закрити"></button>
        </div>

        <h1 class="mb-4">Демонстрація кнопок Bootstrap 5</h1>

        <div class="card p-4 shadow-sm">
            <h5 class="card-title mb-3">Кольорові варіації кнопок:</h5>
            <div class="mb-4">
                <button type="button" class="btn btn-primary m-2">Primary</button>
                <button type="button" class="btn btn-success m-2">Success</button>
                <button type="button" class="btn btn-danger m-2">Danger</button>
                <button type="button" class="btn btn-warning m-2">Warning</button>
                <button type="button" class="btn btn-outline-dark m-2">Outline Dark</button>
            </div>

            <hr>

            <h5 class="card-title mb-3">Різні розміри кнопок:</h5>
            <div class="p-3 bg-secondary rounded text-white">
                <button type="button" class="btn btn-primary btn-lg m-2">Велика кнопка (btn-lg)</button>
                <button type="button" class="btn btn-success m-2">Звичайна кнопка</button>
                <button type="button" class="btn btn-warning btn-sm m-2">Мала кнопка (btn-sm)</button>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
